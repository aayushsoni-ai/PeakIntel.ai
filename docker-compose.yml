version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    container_name: peakIntel_api
    depends_on:
      agents:
        condition: service_started
    env_file:
      - .env
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - AGENTS_URL=http://agents:8001
      - AGENT_SERVER_URL=http://agents:8001
    ports:
      - "3001:3001"
    volumes:
      - ./packages/shared:/app/packages/shared
      - ./packages/database:/app/packages/database
      - ./apps/api/src:/app/apps/api/src
    working_dir: /app
    entrypoint: ""
    command: pnpm dev:api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
    container_name: peakIntel_web
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/components:/app/apps/web/components

  agents:
    build:
      context: .
      dockerfile: packages/agents/Dockerfile
    container_name: peakIntel_agents
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - ./packages/agents/src:/app/src
      - ./packages/agents/run_agents.py:/app/run_agents.py
