version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm
            - echo 'node-linker=hoisted' >> .npmrc
            - pnpm install
        build:
          commands:
            - pnpm --filter=@peakIntel/web... run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ~/.pnpm-store/**/*